<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHBOURNE SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#05060a;
font-family:'Rajdhani', sans-serif;
color:white;
overflow-x:hidden;
}

/* TITLE */
h1{
text-align:center;
margin-top:40px;
font-family:'Orbitron', sans-serif;
letter-spacing:12px;
color:#b08cff;
text-shadow:0 0 25px rgba(176,140,255,0.4);
}

p{
text-align:center;
color:#aaa;
}

/* MENU GRID */
.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

/* CARD */
.card{
background:#0b0e14;
border:1px solid rgba(255,255,255,0.08);
cursor:pointer;
overflow:hidden;
transition:0.3s;
border-radius:10px;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 40px rgba(120,170,255,0.25);
}

.card img{
width:100%;
height:280px;
object-fit:cover;
transition:0.5s;
}

.card:hover img{
transform:scale(1.1);
}

/* 🔥 FIXED WHITE TEXT (FORCED) */
.card h2{
text-align:center;
font-family:'Orbitron', sans-serif;
letter-spacing:5px;
color:#ffffff !important;
margin:10px 0;
}

/* extra safety */
h2{
color:#ffffff !important;
}

/* glow per character */
.kae:hover{box-shadow:0 0 40px rgba(255,77,109,0.4);}
.nox:hover{box-shadow:0 0 40px rgba(77,163,255,0.4);}
.haz:hover{box-shadow:0 0 40px rgba(255,184,77,0.4);}
.tre:hover{box-shadow:0 0 40px rgba(77,255,184,0.4);}
</style>
</head>

<body>

<h1>ASHBOURNE SYSTEM</h1>
<p>SELECT SUBJECT FILE</p>

<div class="menu">

<a href="kaethryn.html">
<div class="card kae">
<img src="kaethryn.png">
<h2>KAETHRYN</h2>
</div>
</a>

<a href="nox.html">
<div class="card nox">
<img src="nox.png">
<h2>NOX</h2>
</div>
</a>

<a href="hazel.html">
<div class="card haz">
<img src="hazel.png">
<h2>HAZEL</h2>
</div>
</a>

<a href="trey.html">
<div class="card tre">
<img src="trey.png">
<h2>TREY</h2>
</div>
</a>

</div>

</body>
</html>
