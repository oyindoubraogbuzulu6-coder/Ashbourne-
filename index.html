<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHBOURNE SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#05060a;
font-family:'Rajdhani', sans-serif;
overflow-y:auto;
overflow-x:hidden;
min-height:100vh;
  }

/* TRANSITION OVERLAY */
#transition{
position:fixed;
inset:0;
background:black;
opacity:0;
pointer-events:none;
transition:0.9s ease;
z-index:999;
}

#transition.active{
opacity:1;
}

/* TITLE */
h1{
text-align:center;
margin-top:40px;
font-family:'Orbitron', sans-serif;
letter-spacing:12px;
color:#b08cff;
text-shadow:0 0 25px rgba(176,140,255,0.4);
}

p{
text-align:center;
color:#888;
}

/* MENU */
.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#0b0e14;
border:1px solid rgba(255,255,255,0.08);
cursor:pointer;
overflow:hidden;
transition:0.3s;
}

.card:hover{
transform:scale(1.06);
box-shadow:0 0 40px rgba(120,170,255,0.3);
}

.card img{
width:100%;
height:280px;
object-fit:cover;
transition:0.5s;
}

.card:hover img{
transform:scale(1.1);
}

.card h2{
text-align:center;
font-family:'Orbitron', sans-serif;
letter-spacing:5px;
color:white;
margin:10px 0;
}

/* glow per character */
.kae:hover{box-shadow:0 0 40px rgba(255,77,109,0.4);}
.nox:hover{box-shadow:0 0 40px rgba(77,163,255,0.4);}
.haz:hover{box-shadow:0 0 40px rgba(255,184,77,0.4);}
.tre:hover{box-shadow:0 0 40px rgba(77,255,184,0.4);}
</style>
</head>

<body>

<div id="transition"></div>

<h1>ASHBOURNE SYSTEM</h1>
<p>SELECT SUBJECT FILE</p>

<div class="menu">

<div class="card kae" onclick="go('kaethryn.html')">
<img src="kaethryn.png">
<h2>KAETHRYN</h2>
</div>

<div class="card nox" onclick="go('nox.html')">
<img src="nox.png">
<h2>NOX</h2>
</div>

<div class="card haz" onclick="go('hazel.html')">
<img src="hazel.png">
<h2>HAZEL</h2>
</div>

<div class="card tre" onclick="go('trey.html')">
<img src="trey.png">
<h2>TREY</h2>
</div>

</div>

<script>
function go(page){
const t=document.getElementById("transition");
t.classList.add("active");

setTimeout(()=>{
window.location.href=page;
},900);
}
</script>

</body>
</html>
