<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHBOURNE SYSTEM</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05060a;
color:white;
overflow-x:hidden;
}

h1{
text-align:center;
margin-top:40px;
font-size:3rem;
letter-spacing:10px;
color:#b08cff;
}

p{
text-align:center;
color:#888;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:40px;
}

.card{
position:relative;
overflow:hidden;
border:1px solid rgba(255,255,255,0.08);
transition:0.3s;
background:#0a0c14;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:280px;
object-fit:cover;
filter:contrast(1.1) saturate(1.1);
}

.card h2{
text-align:center;
padding:10px;
letter-spacing:4px;
}

a{color:white;text-decoration:none;}
</style>
</head>

<body>

<h1>ASHBOURNE</h1>
<p>SUBJECT DATABASE ACCESS SYSTEM</p>

<div class="grid">

<a href="kaethryn.html">
<div class="card">
<img src="kaethryn.png">
<h2>KAETHRYN</h2>
</div>
</a>

<a href="nox.html">
<div class="card">
<img src="nox.png">
<h2>NOX</h2>
</div>
</a>

<a href="hazel.html">
<div class="card">
<img src="hazel.png">
<h2>HAZEL</h2>
</div>
</a>

<a href="trey.html">
<div class="card">
<img src="trey.png">
<h2>TREY</h2>
</div>
</a>

</div>

</body>
</html>
